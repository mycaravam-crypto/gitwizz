# Documentation gaps each pull request introduces, posted as one PR comment (docwizz check --since).
name: docwizz
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # check --since needs the base commit
      - uses: mycaravam-crypto/docwizz@3eb69966b0e566b17ab3b799f0f61538cf05f09d # v0.7.108
        with: { path: ., fail: 'true' }   # fails on problems the PR introduces

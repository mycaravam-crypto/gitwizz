# Static analysis (CodeQL) of this repository's own code: C#, plus the GitHub Actions workflows. Runs the
# security-and-quality suite, so alerts cover both vulnerabilities (injection, path traversal, unsafe deserialization)
# and code defects; results land in the Security tab and on the pull request. Complements security.yml, which covers
# known CVEs in dependencies. The weekly run re-scans main, since CodeQL's queries improve without any code change.
name: codeql
on:
  pull_request:
  push: { branches: [main] }
  schedule:
    - cron: '41 6 * * 1'   # Mondays 06:41 UTC
  workflow_dispatch:
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: csharp, build-mode: manual }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      # C# is analysed from a real build, so the extractor sees resolved types and generated code.
      - if: matrix.build-mode == 'manual'
        run: dotnet build gitwizz.slnx --nologo
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

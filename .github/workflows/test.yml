# Build and unit tests on every pull request and on main.
name: test
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { dotnet-version: 10.0.x }
      - run: dotnet build gitwizz.slnx --nologo
      - run: dotnet test gitwizz.slnx --no-build --nologo --logger "trx;LogFileName=results.trx" --results-directory test-results
      # Failed tests as annotations, readable on the PR without opening the log.
      - if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in glob.glob("test-results/**/*.trx", recursive=True):
              for r in ET.parse(f).getroot().iterfind(".//t:UnitTestResult[@outcome='Failed']", ns):
                  msg = " ".join((r.findtext(".//t:Message", "", ns) + " | " + r.findtext(".//t:StackTrace", "", ns)).split())[:900]
                  print(f"::error title={r.get('testName')}::{msg}")

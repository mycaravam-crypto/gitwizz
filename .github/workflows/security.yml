# Open-source CVE scan (Trivy) of every dependency this repository builds with; results land in the Security tab as SARIF.
# Trivy cannot read .csproj files, so the job builds first and scans the *.deps.json files the build writes (the full
# transitive NuGet closure) along with any npm lockfiles. The restore also runs NuGet audit and fails on high/critical
# advisories. Gate: a CRITICAL finding with a fix available fails the job; HIGH shows in the Security tab without
# blocking. The weekly run re-scans main, since new CVEs show up without any code change.
name: security
on:
  pull_request:
  push: { branches: [main] }
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  cve-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - name: Build (NuGet audit fails on high/critical advisories)
        run: dotnet build gitwizz.slnx --nologo -p:WarningsAsErrors=NU1903%3BNU1904
      # trivy-action v0.36.0 postdates the March 2026 tag hijack (GHSA-69fq-xp46-6x23); keep it pinned by SHA,
      # as in erp-connector's security.yml.
      - name: Scan dependencies (SARIF, CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true
